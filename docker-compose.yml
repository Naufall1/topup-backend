services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file:
      - .env
    entrypoint: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]

  webhook:
    build: ./webhook
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      - api
    entrypoint: ["uvicorn", "webhook:app", "--host", "0.0.0.0", "--port", "8001"]
