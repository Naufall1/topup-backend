name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set image tag
        run: echo "VERSION=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Deploy via VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VERSION
          script: |
            KEY_FILE=$(mktemp)
            trap 'rm -f "$KEY_FILE"' EXIT
            cat > "$KEY_FILE" <<'EOF'
            ${{ secrets.LOCAL_SERVER_SSH_KEY }}
            EOF
            chmod 600 "$KEY_FILE"
            ssh -i "$KEY_FILE" -o StrictHostKeyChecking=no ${{ secrets.LOCAL_SERVER_USER }}@${{ secrets.LOCAL_SERVER_HOST }} \
              "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin && /opt/apps/topup-backend/deploy.sh $VERSION"
