name: CI

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/naufall1/topup-backend

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        run: echo "TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:${{ env.TAG }}
            ${{ env.IMAGE_PREFIX }}-api:latest

      - name: Build and push webhook
        uses: docker/build-push-action@v6
        with:
          context: ./webhook
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-webhook:${{ env.TAG }}
            ${{ env.IMAGE_PREFIX }}-webhook:latest
